<?xml version="1.0" encoding="UTF-8"?>
<!--
  Microsoft Excel - user interface reference.

  A clean, organised illustration of the whole window: title bar and Quick
  Access Toolbar, the ribbon tab strip, the Home ribbon with its seven groups,
  the formula bar (Name Box | fx | input), the spreadsheet grid with its
  selected cell, and the sheet-tab strip.

  Every icon is inline vector art, so the file stays sharp at any zoom and
  needs no external fonts or images.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820"
     font-family="Segoe UI, Calibri, Arial, sans-serif" color="#217346" role="img"
     aria-label="Microsoft Excel user interface: ribbon, formula bar and grid">

  <defs>
    <style>
      .ui   { font-size:12px; fill:#323130; }
      .tab  { font-size:12.5px; fill:#323130; }
      .cap  { font-size:11px; fill:#5f6368; }
      .lbl  { font-size:11.5px; fill:#323130; }
      .grpb { stroke:#d6d6d6; stroke-width:1; }
      .rule { stroke:#d0d0d0; stroke-width:1; }
      .cell { stroke:#dcdcdc; stroke-width:1; }
      /* Icons inherit their colour rather than naming it, because a CSS class
         selector cannot reach inside a <use> shadow tree. Inherited values do
         cross that boundary, so `color` is what makes the Quick Access Toolbar
         icons white on the green title bar while the ribbon stays green. */
      .ic   { fill:none; stroke:currentColor; stroke-width:1.35;
              stroke-linecap:round; stroke-linejoin:round; }
      .qat  { color:#ffffff; }
      .icd  { fill:currentColor; }
    </style>

    <!-- Reusable ribbon glyphs, drawn on a 16x16 grid. -->
    <g id="g-paste" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path class="ic" d="M5 3.5V2.6A1 1 0 0 1 6 1.6h4a1 1 0 0 1 1 1v.9"/>
      <rect class="ic" x="3.2" y="3.5" width="9.6" height="11" rx="1"/><path class="ic" d="M5.6 7h4.8M5.6 10h4.8"/></g>
    <g id="g-cut" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><circle class="ic" cx="4.3" cy="12.4" r="1.8"/><circle class="ic" cx="11.7" cy="12.4" r="1.8"/>
      <path class="ic" d="M5.6 11 12.4 2.6M10.4 11 3.6 2.6"/></g>
    <g id="g-copy" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><rect class="ic" x="2.4" y="1.6" width="8" height="9.6" rx="1"/>
      <path class="ic" d="M5.6 14.4h6.8a1.2 1.2 0 0 0 1.2-1.2V6.4"/></g>
    <g id="g-paint" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path class="ic" d="M10.9 1.8 14.2 5.1 7 12.3l-3.5.7.7-3.5z"/><path class="ic" d="M2.6 13.6h3.2"/></g>
    <g id="g-border" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><rect class="ic" x="1.8" y="1.8" width="12.4" height="12.4" rx="1" stroke-dasharray="2 1.6"/></g>
    <g id="g-alignl" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path class="ic" d="M2 3h12M2 6.6h7.4M2 10.2h12M2 13.4h7.4"/></g>
    <g id="g-alignc" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path class="ic" d="M2 3h12M4.3 6.6h7.4M2 10.2h12M4.3 13.4h7.4"/></g>
    <g id="g-alignr" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path class="ic" d="M2 3h12M6.6 6.6h7.4M2 10.2h12M6.6 13.4h7.4"/></g>
    <g id="g-valignt" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path class="ic" d="M3 2v12M5.6 5h8.4M5.6 9h5.4M5.6 13h8.4"/></g>
    <g id="g-valignm" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path class="ic" d="M3 2v12M5.6 8h8.4"/></g>
    <g id="g-valignb" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path class="ic" d="M3 2v12M5.6 3h8.4M5.6 7h5.4M5.6 11h8.4"/></g>
    <g id="g-wrap" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path class="ic" d="M2 4.4h12M2 8h8.4M2 11.6h6.4"/><path class="ic" d="M10.4 9.6 12.4 11.6l2-2"/></g>
    <g id="g-merge" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><rect class="ic" x="1.8" y="3.2" width="5" height="9.6" rx=".8"/>
      <rect class="ic" x="9.2" y="3.2" width="5" height="9.6" rx=".8"/><path class="ic" d="M8 1.8v12.4" stroke-dasharray="1.6 1.6"/></g>
    <g id="g-pct" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><circle class="ic" cx="4.8" cy="4.8" r="2"/><circle class="ic" cx="11.2" cy="11.2" r="2"/>
      <path class="ic" d="M12.8 3.2 3.2 12.8"/></g>
    <g id="g-comma" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path class="ic" d="M7.4 2.8h3.6v3.9c0 2.5-1.4 4.4-3.1 5.6L6.8 11c1.3-1 2.1-2.4 2.1-4.1H7.4z"/></g>
    <g id="g-dec" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><circle class="icd" cx="3.6" cy="12.6" r="1"/><circle class="ic" cx="7.4" cy="12.6" r="1.9"/>
      <circle class="ic" cx="11.2" cy="12.6" r="1.9"/><path class="ic" d="M9.6 4.2h4.8M12.4 2.5l1.9 1.7-1.9 1.7"/></g>
    <g id="g-styles" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><rect class="ic" x="2" y="2" width="8.6" height="11" rx="1"/><path class="ic" d="M4 5h4.6M4 7.4h4.6M4 9.8h3"/>
      <path class="ic" d="M11.4 9.4l3 3-1.7 1.7-3-3z"/></g>
    <g id="g-insert" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><rect class="ic" x="1.8" y="1.8" width="12.4" height="12.4" rx="1"/>
      <path class="ic" d="M1.8 8h12.4M8 1.8v4.4M6.3 4.2 8 2.4l1.7 1.8"/></g>
    <g id="g-delete" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><rect class="ic" x="1.8" y="1.8" width="12.4" height="12.4" rx="1"/>
      <path class="ic" d="M5.4 5.4l5.2 5.2M10.6 5.4l-5.2 5.2"/></g>
    <g id="g-format" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><rect class="ic" x="1.6" y="2.6" width="12.8" height="10.8" rx="1"/>
      <path class="ic" d="M1.6 6.2h12.8M6 2.6v10.8"/><path class="ic" d="M13 1.4h2.2v2.2"/></g>
    <g id="g-sum" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path class="ic" d="M3.2 2.8h9.6M8 2.8 4.2 8 8 13.2M8 8l3.8 5.2"/></g>
    <g id="g-fill" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path class="ic" d="M8 1.8v7.4M5.4 6.8 8 9.4l2.6-2.6"/><path class="ic" d="M2.6 12.6h10.8"/></g>
    <g id="g-sort" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path class="ic" d="M3.4 12.6V3.4M1.4 5.4l2-2 2 2"/><path class="ic" d="M12.6 3.4v9.2M10.6 10.6l2 2 2-2"/></g>
    <g id="g-find" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><circle class="ic" cx="6.9" cy="6.9" r="4.2"/><path class="ic" d="M10 10l3.6 3.6"/></g>
    <g id="g-save" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path class="ic" d="M2.6 2.6h9l1.8 1.8v9H2.6z"/><path class="ic" d="M5 2.6v4h5v-4M5 13.4v-4h6v4"/></g>
    <g id="g-undo" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path class="ic" d="M3 8.4h6.2a3.4 3.4 0 0 1 0 6.8H6"/><path class="ic" d="M5.6 5.6 2.8 8.4l2.8 2.8"/></g>
    <g id="g-redo" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path class="ic" d="M13 8.4H6.8a3.4 3.4 0 0 0 0 6.8H10"/><path class="ic" d="M10.4 5.6l2.8 2.8-2.8 2.8"/></g>
    <g id="g-face" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><circle class="ic" cx="8" cy="8" r="6.2"/><path class="ic" d="M5.4 6.2h.1M10.5 6.2h.1M5.4 9.4a3.4 3.4 0 0 0 5.2 0"/></g>
  </defs>

  <rect width="1440" height="820" fill="#ffffff"/>
  <!-- ============ title bar + Quick Access Toolbar ============ -->
  <rect x="0" y="0" width="1440" height="36" fill="#217346"/>
  <text class="ui" x="18" y="23" fill="#ffffff">AutoSave</text>
  <rect x="74" y="11" width="30" height="15" rx="7.5" fill="#ffffff" opacity=".28"/>
  <circle cx="96" cy="18.5" r="5.4" fill="#ffffff"/>
  <text class="ui" x="110" y="23" fill="#ffffff" opacity=".9">Off</text>
  <g class="qat">
    <!-- Drawn inline rather than via <use>: the cloned glyphs were not picking
         up the inherited white from this group, so they vanished on the green. -->
    <g fill="none" stroke="#ffffff" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4.6 4.6h7.6l2.6 2.6v7.2H4.6z" transform="translate(146,7)"/>
      <path d="M6.6 4.6v3.4h4.6V4.6M6.6 14.4v-3.6h6v3.6" transform="translate(146,7)"/>
    </g>
    <g fill="none" stroke="#ffffff" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 8.6h5.4a3.2 3.2 0 0 1 0 6.4H7.8M7.4 6l-2.6 2.6 2.6 2.6" transform="translate(180,7)"/>
    </g>
    <g fill="none" stroke="#ffffff" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"
       opacity=".5">
      <path d="M11 8.6H5.6a3.2 3.2 0 0 0 0 6.4h2.6M8.6 6l2.6 2.6-2.6 2.6" transform="translate(210,7)"/>
    </g>
    <path class="ic" d="M244 15.6l3 3 3-3" opacity=".85"/>
    <path class="ic" d="M258 15.6l3 3 3-3" opacity=".85"/>
    <use href="#g-face" x="1284" y="10"/>
  </g>
  <text x="720" y="23" font-size="12.5" fill="#ffffff" text-anchor="middle">Book1 - Excel</text>
  <path d="M1338 24V12h13v12M1338 12l6.5-5 6.5 5" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
  <rect x="1372" y="12" width="12" height="12" fill="none" stroke="#ffffff" stroke-width="1.2"/>
  <path d="M1372 16h12M1376 12v12" stroke="#ffffff" stroke-width="1.1"/>
  <path d="M1404 12l12 12M1416 12l-12 12" stroke="#ffffff" stroke-width="1.3"/>

  <!-- ============ ribbon tab strip ============ -->
  <rect x="0" y="36" width="1440" height="36" fill="#f3f2f1"/>
  <path class="rule" d="M0 71.5h1440"/>
  <rect x="10" y="40" width="60" height="28" rx="2" fill="#217346"/>
  <text class="tab" x="40" y="59" fill="#ffffff" text-anchor="middle">File</text>

  <rect x="78" y="38" width="62" height="30" fill="#ffffff"/>
  <text class="tab" x="109" y="58" text-anchor="middle" font-weight="600">Home</text>
  <rect x="140" y="70" width="62" height="3" fill="#217346"/>

  <text class="tab" x="170" y="58" text-anchor="middle">Insert</text>
  <text class="tab" x="236" y="58" text-anchor="middle">Page Layout</text>
  <text class="tab" x="308" y="58" text-anchor="middle">Formulas</text>
  <text class="tab" x="368" y="58" text-anchor="middle">Data</text>
  <text class="tab" x="413" y="58" text-anchor="middle">Review</text>
  <text class="tab" x="464" y="58" text-anchor="middle">View</text>
  <text class="tab" x="508" y="58" text-anchor="middle">Team</text>
  <!-- ============ Home ribbon: seven groups ============ -->
  <rect x="0" y="72" width="1440" height="148" fill="#ffffff"/>
  <path class="rule" d="M0 219.5h1440"/>

  <!-- Clipboard -->
  <g transform="translate(52,86) scale(1.6)"><use href="#g-paste"/></g>
  <text class="lbl" x="64" y="128" text-anchor="middle">Paste</text>
  <use href="#g-cut"   x="28" y="142"/><use href="#g-copy" x="56" y="142"/><use href="#g-paint" x="84" y="142"/>
  <text class="cap" x="68" y="208" text-anchor="middle">Clipboard</text>
  <path class="grpb" d="M128 84v118"/>

  <!-- Font -->
  <rect x="140" y="82" width="104" height="24" fill="#ffffff" stroke="#c8c8c8"/>
  <text class="ui" x="148" y="99">Calibri</text><path class="ic" d="M228 91l4 4 4-4"/>
  <rect x="250" y="82" width="52" height="24" fill="#ffffff" stroke="#c8c8c8"/>
  <text class="ui" x="258" y="99">11</text><path class="ic" d="M286 91l4 4 4-4"/>
  <text x="320" y="100" font-size="13" font-weight="700" fill="#323130">A</text>
  <text x="342" y="100" font-size="10" fill="#323130">A</text>
  <text x="146" y="133" font-size="14" font-weight="700" fill="#323130">B</text>
  <text x="172" y="133" font-size="14" font-style="italic" fill="#323130">I</text>
  <text x="196" y="133" font-size="14" text-decoration="underline" fill="#323130">U</text>
  <use href="#g-border" x="220" y="117"/>
  <rect x="258" y="119" width="20" height="16" fill="#ffd966"/><rect x="256" y="117" width="20" height="16" fill="none" stroke="#9a9a9a"/>
  <text x="298" y="133" font-size="14" font-weight="700" fill="#323130">A</text>
  <rect x="296" y="135" width="18" height="4" fill="#c00000"/>
  <text class="cap" x="234" y="208" text-anchor="middle">Font</text>
  <path class="grpb" d="M352 84v118"/>

  <!-- Alignment -->
  <use href="#g-valignt" x="362" y="86"/><use href="#g-valignm" x="386" y="86"/><use href="#g-valignb" x="410" y="86"/>
  <use href="#g-alignl" x="438" y="86"/><use href="#g-alignc" x="462" y="86"/><use href="#g-alignr" x="486" y="86"/>
  <text x="512" y="99" font-size="10" fill="#323130">ab</text>
  <path class="ic" d="M508 104l4 4 4-4"/>
  <use href="#g-wrap" x="362" y="116"/><use href="#g-merge" x="390" y="116"/>
  <text x="424" y="130" font-size="11" fill="#323130">1</text>
  <text x="444" y="130" font-size="11" fill="#323130">2</text>
  <text class="cap" x="434" y="208" text-anchor="middle">Alignment</text>
  <path class="grpb" d="M524 84v118"/>

  <!-- Number -->
  <rect x="536" y="82" width="86" height="24" fill="#ffffff" stroke="#c8c8c8"/>
  <text class="ui" x="544" y="99">General</text><path class="ic" d="M606 91l4 4 4-4"/>
  <text x="540" y="131" font-size="13" fill="#323130">$</text>
  <use href="#g-pct"   x="564" y="115"/>
  <use href="#g-comma" x="588" y="115"/>
  <use href="#g-dec"   x="612" y="115"/>
  <text class="cap" x="578" y="208" text-anchor="middle">Number</text>
  <path class="grpb" d="M640 84v118"/>

  <!-- Styles -->
  <text x="654" y="112" font-size="28" fill="#2b579a">A</text>
  <text class="lbl" x="672" y="134">Styles</text>
  <text class="cap" x="672" y="208" text-anchor="middle">Styles</text>
  <path class="grpb" d="M700 84v118"/>

  <!-- Cells: spaced far enough apart that the three captions cannot collide. -->
  <use href="#g-insert" x="704" y="86"/><use href="#g-delete" x="748" y="86"/><use href="#g-format" x="792" y="86"/>
  <text class="lbl" x="712" y="130" text-anchor="middle">Insert</text>
  <text class="lbl" x="756" y="130" text-anchor="middle">Delete</text>
  <text class="lbl" x="800" y="130" text-anchor="middle">Format</text>
  <text class="cap" x="760" y="208" text-anchor="middle">Cells</text>
  <path class="grpb" d="M824 84v118"/>

  <!-- Editing -->
  <use href="#g-sum"  x="836" y="86"/>
  <text class="lbl" x="860" y="100">AutoSum</text>
  <use href="#g-fill"  x="836" y="116"/><text class="lbl" x="860" y="130">Fill</text>
  <use href="#g-sort" x="900" y="116"/><text class="lbl" x="924" y="130">Sort &amp; Filter</text>
  <use href="#g-find" x="836" y="146"/><text class="lbl" x="860" y="160">Find &amp; Select</text>
  <text class="cap" x="914" y="208" text-anchor="middle">Editing</text>
  <!-- ============ formula bar ============ -->
  <rect x="0" y="220" width="1440" height="32" fill="#ffffff"/>
  <path class="rule" d="M0 251.5h1440"/>
  <rect x="6" y="225" width="104" height="22" fill="#ffffff" stroke="#c8c8c8"/>
  <text class="ui" x="14" y="241">A1</text>
  <path class="ic" d="M96 233l4 4 4-4"/>
  <text class="ui" x="126" y="242" font-style="italic" font-weight="600" font-size="13">fx</text>
  <rect x="146" y="225" width="1274" height="22" fill="#ffffff" stroke="#c8c8c8"/>
  <text class="ui" x="156" y="241">=SUM(A1:A10)</text>
  <path class="ic" d="M1404 233l4 4 4-4"/>

  <!-- ============ grid ============ -->
  <!-- Column headers. The selected-column tint is painted before the letters,
       otherwise it covers the "A" that it is meant to sit behind. -->
  <rect x="0" y="252" width="1424" height="24" fill="#f3f2f1"/>
  <rect x="46" y="252" width="100" height="24" fill="#e4e4e4"/>
  <g class="cell">
    <path d="M146 252v24M246 252v24M346 252v24M446 252v24M546 252v24M646 252v24M746 252v24M846 252v24M946 252v24M1046 252v24M1146 252v24M1246 252v24M1346 252v24"/>
    <path d="M0 275.5h1424M46 252v528"/>
  </g>
  <g class="ui" text-anchor="middle" fill="#323130">
    <text x="96" y="269">A</text><text x="196" y="269">B</text><text x="296" y="269">C</text>
    <text x="396" y="269">D</text><text x="496" y="269">E</text><text x="596" y="269">F</text>
    <text x="696" y="269">G</text><text x="796" y="269">H</text><text x="896" y="269">I</text>
    <text x="996" y="269">J</text><text x="1096" y="269">K</text><text x="1196" y="269">L</text>
    <text x="1296" y="269">M</text>
  </g>
  <path d="M46 274.5h100" stroke="#217346" stroke-width="2.5"/>

  <!-- Body: 21 rows of 24px, ending at y=780 so the sheet tabs still fit. -->
  <rect x="46" y="276" width="1378" height="504" fill="#ffffff"/>
  <g class="cell">
    <path d="M0 300h1424M0 324h1424M0 348h1424M0 372h1424M0 396h1424M0 420h1424M0 444h1424M0 468h1424M0 492h1424M0 516h1424M0 540h1424M0 564h1424M0 588h1424M0 612h1424M0 636h1424M0 660h1424M0 684h1424M0 708h1424M0 732h1424M0 756h1424M0 779.5h1424"/>
    <path d="M146 276v504M246 276v504M346 276v504M446 276v504M546 276v504M646 276v504M746 276v504M846 276v504M946 276v504M1046 276v504M1146 276v504M1246 276v504M1346 276v504"/>
  </g>

  <!-- Row headers -->
  <rect x="0" y="276" width="46" height="504" fill="#f3f2f1"/>
  <g class="ui" text-anchor="middle" fill="#5f6368">
    <text x="23" y="293">1</text><text x="23" y="317">2</text><text x="23" y="341">3</text>
    <text x="23" y="365">4</text><text x="23" y="389">5</text><text x="23" y="413">6</text>
    <text x="23" y="437">7</text><text x="23" y="461">8</text><text x="23" y="485">9</text>
    <text x="23" y="509">10</text><text x="23" y="533">11</text><text x="23" y="557">12</text>
    <text x="23" y="581">13</text><text x="23" y="605">14</text><text x="23" y="629">15</text>
    <text x="23" y="653">16</text><text x="23" y="677">17</text><text x="23" y="701">18</text>
    <text x="23" y="725">19</text><text x="23" y="749">20</text><text x="23" y="773">21</text>
  </g>

  <!-- the selected cell, A1 -->
  <rect x="46.5" y="276.5" width="99" height="23" fill="none" stroke="#217346" stroke-width="2.5"/>
  <rect x="142" y="296" width="5" height="5" fill="#217346"/>

  <!-- ============ sheet tab strip ============ -->
  <rect x="0" y="780" width="1424" height="26" fill="#f3f2f1"/>
